# Skykeep as a Flatpak, for Flathub.
#
# Built in CI by hand (.github/workflows/flatpak.yml, Actions → Flatpak → Run workflow), which
# needs nothing installed locally; until that has passed once, treat it as unbuilt.
# packaging/flatpak/README.md lists what was checked, what was not, and the open questions.
#
# The Tauri identifier (src-tauri/tauri.conf.json) is this app ID, so the window's Wayland app
# ID, the per-app windows (<id>.Notes, …) and the single-instance D-Bus name
# (<id>.SingleInstance, which the sandbox may own by default) all agree with it.
#
# Runtime: GNOME 51, the current stable. Checked 2026-10-21 against gnome-build-meta: branch
# gnome-51, tags 51.0 (2026-09-16) and 51.1 (2026-10-18); it is built on freedesktop-sdk 26.08.
# Its gnome-51 elements ship webkit2gtk-4.1, gtk3, libsecret, libnotify, GStreamer and libheif
# (via freedesktop-sdk), so none of those are bundled here.
#
# HEIC: the runtime's libheif is built with plugin loading and no HEVC decoder of its own; the
# libde265 plugin comes from org.freedesktop.Platform.codecs-extra, an extension the runtime
# downloads automatically (it is declared without no-autodownload in the GNOME 51 platform
# metadata). That HEIC actually decodes in the sandbox is unverified — see the README.
# Checked 2026-10-21: freedesktop-sdk release/26.08 lists components/libheif.bst in platform.bst,
# built -DWITH_LIBDE265=OFF, confirming the above. So there is no libheif module here.
#
# FUSE: no fuse3 module either. fuser is built with default-features = false, its pure-Rust mount
# path, which links no libfuse; it needs only /dev/fuse and a fusermount3 at run time, and the
# FUSE folders are switched off in this package anyway (see finish-args).
app-id: io.github.yashwanthkamireddi.Skykeep
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  # Both exist with a branch/26.08, the freedesktop-sdk under GNOME 51 (checked 2026-10-21).
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: skykeep

finish-args:
  # iCloud.
  - --share=network
  # The window: Wayland first, X11 only where there is no Wayland.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # The Apple ID session is kept in the Secret Service keyring (keyring crate, Secret Service
  # over D-Bus). Without this the app starts but cannot stay signed in.
  - --talk-name=org.freedesktop.secrets
  # Reminder alerts (notify-rust, org.freedesktop.Notifications over D-Bus).
  - --talk-name=org.freedesktop.Notifications
  # The tray icon (a StatusNotifierItem, spoken by the app over D-Bus).
  - --talk-name=org.kde.StatusNotifierWatcher
  # Files saved from Drive and Photos land in ~/Downloads: the app writes there directly
  # (main.rs, photos.rs: download_dir()), not through the file-chooser portal, so without this
  # every "save" fails inside the sandbox. Narrow and routinely accepted on Flathub; remove it
  # once saving goes through the portal.
  - --filesystem=xdg-download

  # Deliberately NOT granted (README, "Permissions left out"):
  #
  # Drive and Photos as folders (FUSE). Mounting needs /dev/fuse (--device=all) and a working
  # fusermount3, which cannot be setuid inside the sandbox; in practice that means reaching
  # out to the host (flatpak-spawn --host, i.e. --talk-name=org.freedesktop.Flatpak), a full
  # sandbox escape Flathub will question. Off; the folders are unavailable in the Flatpak.
  # - --device=all
  #
  # Waking on resume from sleep (alerts.rs listens for logind's PrepareForSleep). Without it
  # the app falls back to its ten-minute ceiling, which it already handles.
  # - --system-talk-name=org.freedesktop.login1

modules:
  # No tray library: the tray is a StatusNotifierItem the app speaks over D-Bus itself (ksni),
  # registered with the host through --talk-name=org.kde.StatusNotifierWatcher above.

  - name: skykeep
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
      env:
        # Offline: every crate and npm package comes from the generated sources below.
        CARGO_HOME: /run/build/skykeep/cargo
        CARGO_NET_OFFLINE: 'true'
        XDG_CACHE_HOME: /run/build/skykeep/flatpak-node/cache
        npm_config_cache: /run/build/skykeep/flatpak-node/npm-cache
        npm_config_offline: 'true'
        # esbuild's binary, placed by node-sources.json for the build architecture.
        ESBUILD_BINARY_PATH: /run/build/skykeep/flatpak-node/cache/esbuild/bin/esbuild-current
    build-commands:
      # The frontend into dist/, which tauri::generate_context! embeds at compile time.
      - npm ci --offline --no-audit --no-fund
      - npm run build
      # The app. tauri/custom-protocol is what `tauri build` turns on: without it the binary
      # is a dev build (cfg(dev)) — dev CSP and dev behaviour in a release package.
      - cargo --offline build --release --locked -p quince-app --features tauri/custom-protocol
      - install -Dm755 target/release/quince-app ${FLATPAK_DEST}/bin/skykeep

      # The main launcher entry and the metainfo: written for this app ID, kept beside this
      # manifest (packaging/flatpak/), and added as file sources below.
      - desktop-file-validate ${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop

      # The six per-app entries, already named under this app ID (Flatpak exports only desktop
      # files whose names start with it). Exec stays `skykeep --app …`; flatpak rewrites it to
      # `flatpak run --command=skykeep io.github.yashwanthkamireddi.Skykeep --app …` when it
      # exports the file.
      - |
        for entry in packaging/apps/${FLATPAK_ID}.*.desktop; do
          desktop-file-validate "$entry"
          install -Dm644 "$entry" "${FLATPAK_DEST}/share/applications/${entry##*/}"
        done
        test "$(ls ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}*.desktop | wc -l)" -eq 7

      - install -Dm644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml

      # In the desktop's own search (src-tauri/src/search_provider.rs): GNOME Shell's provider,
      # KRunner's D-Bus plugin, and the bus entry that starts Skykeep hidden to answer. The
      # bus name is under the app ID, which the sandbox may own by default; Flatpak exports
      # all three and rewrites the service's Exec to `flatpak run`.
      # The provider names the .deb's launcher (Skykeep.desktop); here it is the app ID's.
      - sed 's|^DesktopId=Skykeep.desktop$|DesktopId=${FLATPAK_ID}.desktop|' packaging/${FLATPAK_ID}.search-provider.ini > ${FLATPAK_ID}.search-provider.ini
      - install -Dm644 ${FLATPAK_ID}.search-provider.ini ${FLATPAK_DEST}/share/gnome-shell/search-providers/${FLATPAK_ID}.search-provider.ini
      - desktop-file-validate packaging/${FLATPAK_ID}.krunner.desktop
      - install -Dm644 packaging/${FLATPAK_ID}.krunner.desktop ${FLATPAK_DEST}/share/krunner/dbusplugins/${FLATPAK_ID}.krunner.desktop
      - sed 's|^Exec=/usr/bin/skykeep|Exec=${FLATPAK_DEST}/bin/skykeep|' packaging/${FLATPAK_ID}.SearchProvider.service > ${FLATPAK_ID}.SearchProvider.service
      - install -Dm644 ${FLATPAK_ID}.SearchProvider.service ${FLATPAK_DEST}/share/dbus-1/services/${FLATPAK_ID}.SearchProvider.service

      # Icons: the rendered sizes, 48x48 the one the icon theme spec asks every app for.
      - install -Dm644 src-tauri/icons/16x16.png ${FLATPAK_DEST}/share/icons/hicolor/16x16/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/24x24.png ${FLATPAK_DEST}/share/icons/hicolor/24x24/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/48x48.png ${FLATPAK_DEST}/share/icons/hicolor/48x48/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/32x32.png ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/64x64.png ${FLATPAK_DEST}/share/icons/hicolor/64x64/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/128x128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/128x128@2x.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png

      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/LICENSE
    sources:
      # The release tag, and the commit it points at.
      - type: git
        url: https://github.com/YashwanthKamireddi/Skykeep.git
        tag: v0.1.3
        commit: d00e4505bd793937d149ee23ccb155747f0fdc5b
      # Kept beside this manifest, written for this app ID.
      - type: file
        path: io.github.yashwanthkamireddi.Skykeep.desktop
      - type: file
        path: io.github.yashwanthkamireddi.Skykeep.metainfo.xml
      # Offline crates and npm packages, generated by flatpak-builder-tools from the locks.
      - cargo-sources.json
      - node-sources.json
